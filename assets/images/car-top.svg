<svg xmlns="http://www.w3.org/2000/svg" width="176" height="176" viewBox="0 0 176 176">
<!-- Renault Mégane II sedan seen from above, front up, simplified from the blueprint into line art. The doors are not
     drawn here: the door diagram (widgets/indicators.cpp) draws them over the sides, so they can light up. -->
<g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
  <!-- body: narrow rounded nose, widest at the doors, rounded tail -->
  <path d="M88 6 C104 6 118 9 124 16 C129 22 131 32 132 44 L133 88 C133 110 132 128 130 142 C128 158 118 168 88 169 C58 168 48 158 46 142 C44 128 43 110 43 88 L44 44 C45 32 47 22 52 16 C58 9 72 6 88 6 Z"/>
  <!-- headlights and the creases of the bonnet -->
  <path d="M50 20 C55 15 62 12 70 11"/>
  <path d="M126 20 C121 15 114 12 106 11"/>
  <path d="M66 16 C64 30 62 40 60 50"/>
  <path d="M110 16 C112 30 114 40 116 50"/>
  <!-- windshield, with curved pillars -->
  <path d="M54 70 C58 60 60 54 62 49 Q88 44 114 49 C116 54 118 60 122 70 Q88 65 54 70 Z"/>
  <!-- roof rails, from the windshield to the rear window -->
  <path d="M54 70 Q53 92 56 112"/>
  <path d="M122 70 Q123 92 120 112"/>
  <!-- rear window and trunk lid -->
  <path d="M56 112 Q88 116 120 112 C118 122 116 128 113 134 Q88 138 63 134 C60 128 58 122 56 112 Z"/>
  <path d="M62 150 Q88 154 114 150"/>
  <!-- mirrors -->
  <path d="M44 60 L36 58 L36 66 L44 67"/>
  <path d="M132 60 L140 58 L140 66 L132 67"/>
</g>
</svg>
